
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pammi Dairy Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f6f4;color:#183b2e}
header{background:#123e30;color:white;padding:25px 18px}
header h1{margin:0;font-size:27px}
header p{color:#c7ded4}
main{max-width:850px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card,.panel{background:white;padding:17px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 9px #0001}
.card small{color:#64786d}
.card h2{color:#148254;margin:10px 0}
h3{margin-top:0}
input,select,button{width:100%;padding:13px;margin:6px 0;border:1px solid #d5dfd9;border-radius:8px;font-size:15px}
button{background:#168052;color:white;border:0;font-weight:bold}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
<h1>🥛 Pammi Dairy</h1>
  <div class="panel">
  <h3>📅 Monthly Customer Bill</h3>
  <select id="billCustomer">
    <option value="">Select Customer</option>
  </select>
  <input type="month" id="billMonth">
  <button onclick="monthlyBill()">Generate Bill</button>
  <div id="billResult"></div>
  </div>
<p>Professional Owner Dashboard</p>
</header>
<main>
<div class="grid">
<div class="card"><small>Total Customers</small><h2 id="customers">0</h2></div>
<div class="card"><small>Today's Milk</small><h2 id="milk">0 L</h2></div>
<div class="card"><small>Total Income</small><h2 id="income">₹0</h2></div>
<div class="card"><small>Pending Payments</small><h2 id="pending">₹0</h2></div>
</div>

<div class="panel">
<h3>➕ Add Customer</h3>
<input id="name" placeholder="Customer Name">
<input id="phone" placeholder="Phone Number">
<button onclick="addCustomer()">Add Customer</button>
</div>

<div class="panel">
<h3>🥛 Add Milk Collection</h3>
<select id="customer"><option value="">Select Customer</option></select>
<input id="litres" type="number" placeholder="Milk in Litres">
<input id="rate" type="number" placeholder="Rate per Litre">
<button onclick="addMilk()">Save Milk</button>
</div>

<div class="panel">
<h3>💰 Record Payment</h3>
<select id="payer"><option value="">Select Customer</option></select>
<input id="payment" type="number" placeholder="Amount in ₹">
<button onclick="addPayment()">Save Payment</button>
</div>

<div class="panel">
<h3>📊 Milk History</h3>
<div class="scroll">
<table>
<thead><tr><th>Date</th><th>Customer</th><th>Milk</th><th>Amount</th></tr></thead>
<tbody id="history"></tbody>
</table>
</div>
</div>

<div class="panel">
<h3>👥 Customers</h3>
<div class="scroll">
<table>
<thead><tr><th>Name</th><th>Phone</th><th>Balance</th></tr></thead>
<tbody id="list"></tbody>
</table>
</div>
</div>

<div class="panel">
<h3>📥 Backup</h3>
<button onclick="backup()">Download Backup</button>
</div>
</main>

<script>
let people=JSON.parse(localStorage.getItem("pammi_people")||"[]");
let milk=JSON.parse(localStorage.getItem("pammi_milk")||"[]");
let paid=JSON.parse(localStorage.getItem("pammi_paid")||"[]");

function save(){
localStorage.setItem("pammi_people",JSON.stringify(people));
localStorage.setItem("pammi_milk",JSON.stringify(milk));
localStorage.setItem("pammi_paid",JSON.stringify(paid));
show();
}
function addCustomer(){
let n=name.value.trim(),p=phone.value.trim();
if(!n){alert("Enter customer name");return}
people.push({id:Date.now(),n,p});
name.value="";phone.value="";save();
}
function addMilk(){
let id=Number(customer.value),q=Number(litres.value),r=Number(rate.value);
let c=people.find(x=>x.id===id);
if(!c||q<=0||r<=0){alert("Enter valid details");return}
milk.push({id,n:c.n,q,r,total:q*r,date:new Date().toLocaleDateString()});
litres.value="";save();
}
function addPayment(){
let id=Number(payer.value),a=Number(payment.value);
if(!people.some(x=>x.id===id)||a<=0){alert("Enter valid payment");return}
paid.push({id,a});payment.value="";save();
}
function balance(id){
return milk.filter(x=>x.id===id).reduce((s,x)=>s+x.total,0)-paid.filter(x=>x.id===id).reduce((s,x)=>s+x.a,0);
}
function show(){
customers.textContent=people.length;
let today=new Date().toLocaleDateString();
document.getElementById("milk").textContent=milk.filter(x=>x.date===today).reduce((s,x)=>s+x.q,0)+" L";
income.textContent="₹"+paid.reduce((s,x)=>s+x.a,0);
pending.textContent="₹"+people.reduce((s,x)=>s+Math.max(0,balance(x.id)),0);
["customer","payer"].forEach(id=>{
let el=document.getElementById(id),old=el.value;
el.innerHTML='<option value="">Select Customer</option>';
people.forEach(c=>el.add(new Option(c.n,c.id)));
el.value=old;
});
list.innerHTML=people.map(c=>`<tr><td>${safe(c.n)}</td><td>${safe(c.p)}</td><td>₹${balance(c.id).toFixed(2)}</td></tr>`).join("");
history.innerHTML=milk.slice().reverse().map(x=>`<tr><td>${safe(x.date)}</td><td>${safe(x.n)}</td><td>${x.q} L</td><td>₹${x.total}</td></tr>`).join("");
}
function safe(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function backup(){
let data={people,milk,paid};
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
a.download="pammi-dairy-backup.json";a.click();
URL.revokeObjectURL(a.href);
}
show();
</script>
</body>
</html>
